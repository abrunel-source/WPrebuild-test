# Decap CMS configuration for Florida Clinicians for Climate Action.
# Editors manage content at /admin. Saving commits Markdown to the repo, which
# triggers a Vercel rebuild + redeploy so changes appear on the live site.

backend:
  # GitHub backend (Vercel hosting — git-gateway/Netlify Identity is not used).
  # The OAuth handshake is served by this same site's serverless functions
  # (src/pages/api/auth.ts + callback.ts). Configure a GitHub OAuth App with
  # callback URL https://<site>/api/callback and set the client id/secret as
  # Vercel env vars (OAUTH_GITHUB_CLIENT_ID / OAUTH_GITHUB_CLIENT_SECRET).
  name: github
  repo: abrunel-source/wprebuild-test
  branch: main # production branch the site deploys from
  base_url: https://floridaclinicians.org
  auth_endpoint: /api/auth

# Draft -> In review -> Ready. Editors draft; admins do the final publish.
publish_mode: editorial_workflow

# Uploads land in /public/media (alongside the imported WordPress media) and are
# referenced from the site root as /media/...
media_folder: "public/media/uploads"
public_folder: "/media/uploads"

collections:
  - name: "events"
    label: "Events"
    label_singular: "Event"
    description: "Webinars, CME sessions, meetings, and community events."
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", required: false }
      - { label: "Time", name: "time", widget: "string", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - label: "Region"
        name: "region"
        widget: "select"
        required: false
        options: ["South Florida", "Virtual"]
      - { label: "Registration URL", name: "registrationUrl", widget: "string", required: false }
      - { label: "Registration Button Text", name: "registrationText", widget: "string", required: false, default: "Register" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Image Alt", name: "imageAlt", widget: "string", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "team"
    label: "Team Members"
    label_singular: "Team Member"
    folder: "src/content/team"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["order", "title"]
    fields:
      - { label: "Name", name: "title", widget: "string" }
      - { label: "Role", name: "role", widget: "string", required: false }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - label: "Group"
        name: "group"
        widget: "select"
        default: "The Leadership Team"
        options:
          - "Board Of Directors"
          - "The Leadership Team"
          - "Educational Committee"
          - "Advocacy Committee"
      - { label: "Order", name: "order", widget: "number", default: 999, value_type: "int" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Bio", name: "body", widget: "markdown", required: false }

  - name: "resources"
    label: "Education / Resources"
    label_singular: "Resource"
    folder: "src/content/resources"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Document (PDF/PPT URL)", name: "document", widget: "string", required: false }
      - { label: "External URL", name: "externalUrl", widget: "string", required: false }
      - { label: "YouTube URL", name: "youtube", widget: "string", required: false }
      - { label: "SoundCloud URL", name: "soundcloud", widget: "string", required: false }
      - label: "Categories"
        name: "categories"
        widget: "select"
        multiple: true
        required: false
        options:
          - "Climate Change 101"
          - "Education and Outreach"
          - "Heat and Health"
          - "Reports"
          - "Webinars"
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "partners"
    label: "Funders / Partners"
    label_singular: "Funder"
    folder: "src/content/partners"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Name", name: "title", widget: "string" }
      - { label: "Logo", name: "logo", widget: "image", required: false }
      - { label: "Mission", name: "mission", widget: "text", required: false }
      - { label: "Grant Date", name: "grantDate", widget: "datetime", required: false }
      - { label: "Amount", name: "amount", widget: "string", required: false }
      - { label: "Status", name: "status", widget: "select", default: "Active", options: ["Active", "Completed"] }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "news"
    label: "News & Press"
    label_singular: "News Item"
    folder: "src/content/news"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["In the Press", "FCCA News"], default: "In the Press" }
      - { label: "Date", name: "date", widget: "datetime", required: false }
      - { label: "External URL", name: "externalUrl", widget: "string", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "newsletters"
    label: "Newsletters"
    label_singular: "Newsletter"
    folder: "src/content/newsletters"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", required: false }
      - { label: "External URL (Mailchimp)", name: "externalUrl", widget: "string", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    description: "Legal and standalone content pages (privacy, terms)."
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
